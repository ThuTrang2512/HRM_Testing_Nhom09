<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đi Lạc Coffee - Thêm hợp đồng</title>

    <!-- Global CSS -->
    <link rel="stylesheet" href="../../assets/css/style.css">

    <!-- Icons -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Montserrat', 'sans-serif'],
                        heading: ['Nunito', 'sans-serif'],
                    },
                    colors: {
                        brand: {
                            text: '#5c4133',
                            dark: 'rgba(75, 46, 31, 0.87)',
                            primary: '#78594A',
                            light: '#f4ede7',
                            active: '#d6b5a3',
                            border: '#d2c5bc'
                        }
                    }
                }
            }
        }
    </script>
    <style>
        .nav-item {
            position: relative;
            white-space: nowrap;
        }

        .nav-item.active {
            font-weight: 700;
            color: #d6b5a3;
        }

        .nav-item.active::after {
            content: '';
            position: absolute;
            bottom: 0px;
            left: 0;
            right: 0;
            height: 4px;
            background-color: #d6b5a3;
            border-radius: 2px 2px 0 0;
        }
    </style>
</head>

<body class="bg-[#fcfcfc] min-h-screen text-[23px] text-gray-800 flex flex-col font-sans">

    <!-- Header Section -->
    <header class="bg-white px-8 py-3 flex justify-between items-center sm:flex-row flex-col gap-4 border-b border-gray-100">
        <div class="flex items-center gap-4">
            <div class="w-16 h-16 rounded-full overflow-hidden flex-shrink-0 flex items-center justify-center bg-[#2d221c]">
                <img src="../../assets/images/logo.png" alt="Logo Đi Lạc" class="w-full h-full object-cover">
            </div>
            <h1 class="font-bold text-[26px] uppercase tracking-wider text-brand-text m-0">ĐI LẠC COFFEE</h1>
        </div>
        <div class="flex items-center gap-4">
            <span class="text-gray-800 text-[23px]"><span class="italic font-medium">Xin chào, </span><span class="italic font-bold">Đi Lạc coffee</span></span>
            <div class="w-12 h-12 rounded-full flex items-center justify-center text-gray-700 cursor-pointer transition">
                <i class="fa-regular fa-circle-user text-[40px]"></i>
            </div>
        </div>
    </header>

    <!-- Navigation -->
    <nav class="bg-[#4B2E1F]/[0.87] px-8 py-0 flex flex-wrap justify-center gap-x-12 gap-y-2 text-white text-[23px] font-semibold">
        <a href="../dashboard.html" class="nav-item py-[16px] transition-colors hover:text-[#d6b5a3]">Tổng quan</a>
        <a href="../employee/employee_list.html" class="nav-item py-[16px] transition-colors hover:text-[#d6b5a3]">Nhân viên</a>
        <a href="contract_list.html" class="nav-item active py-[16px] transition-colors hover:text-[#d6b5a3]">Hợp đồng</a>
        <a href="../schedule/schedule_list.html" class="nav-item py-[16px] transition-colors hover:text-[#d6b5a3]">Lịch làm việc</a>
        <a href="#" class="nav-item py-[16px] transition-colors hover:text-[#d6b5a3]">Yêu cầu</a>
        <a href="#" class="nav-item py-[16px] transition-colors hover:text-[#d6b5a3]">Bảng lương</a>
        <a href="#" class="nav-item py-[16px] transition-colors hover:text-[#d6b5a3]">Báo cáo</a>
    </nav>

    <!-- Main Content -->
    <main class="flex-grow p-8 max-w-[1400px] w-full mx-auto">
        <div class="bg-white rounded-lg shadow-sm w-full p-10 pt-6">
            <div class="mb-8">
                <a href="contract_list.html" class="flex items-center uppercase font-bold text-[24px] text-brand-text hover:text-brand-primary transition mb-1">
                    <i class="fa-solid fa-arrow-left text-[20px] mr-3"></i>
                    THÊM HỢP ĐỒNG LAO ĐỘNG
                </a>
            </div>

            <form id="contractAddForm" class="flex flex-col gap-10">
                <input type="hidden" id="contractId">
                <input type="hidden" id="employeeId">
                <div class="grid grid-cols-1 xl:grid-cols-2 gap-10 text-[18px]">
                    <div class="flex flex-col">
                        <label class="font-bold text-gray-800 mb-2">Tên nhân viên <span class="text-red-500">*</span></label>
                        <select id="employeeName" class="border border-gray-300 rounded-md px-4 py-3 focus:outline-none focus:border-brand-primary bg-white appearance-none">
                            <option value="" data-id="">Chọn nhân viên</option>
                            <option value="Nguyễn Văn An" data-id="NV00001">Nguyễn Văn An</option>
                            <option value="Lê Hoài Bảo An" data-id="NV00002">Lê Hoài Bảo An</option>
                            <option value="Trần Thị Mai Loan" data-id="NV00003">Trần Thị Mai Loan</option>
                            <option value="Phạm Quang Bảo" data-id="NV00004">Phạm Quang Bảo</option>
                            <option value="Nguyễn Viết Bảo" data-id="NV00005">Nguyễn Viết Bảo</option>
                        </select>
                    </div>
                    <div class="flex flex-col">
                        <label class="font-bold text-gray-800 mb-2">Loại hợp đồng <span class="text-red-500">*</span></label>
                        <select id="contractType" class="border border-gray-300 rounded-md px-4 py-3 focus:outline-none focus:border-brand-primary bg-white appearance-none">
                            <option value="Part-time">Part time</option>
                            <option value="Full-time">Full time</option>
                        </select>
                    </div>
                    <div class="flex flex-col">
                        <label class="font-bold text-gray-800 mb-2">Ngày bắt đầu <span class="text-red-500">*</span></label>
                        <input type="date" id="startDate" class="border border-gray-300 rounded-md px-4 py-3 focus:outline-none focus:border-brand-primary bg-white">
                    </div>
                    <div class="flex flex-col">
                        <label class="font-bold text-gray-800 mb-2">Ngày kết thúc <span class="text-red-500">*</span></label>
                        <input type="date" id="endDate" class="border border-gray-300 rounded-md px-4 py-3 focus:outline-none focus:border-brand-primary bg-white">
                    </div>
                    <div class="flex flex-col">
                        <label class="font-bold text-gray-800 mb-2">Mức lương <span class="text-red-500">*</span></label>
                        <input type="text" id="salary" class="border border-gray-300 rounded-md px-4 py-3 focus:outline-none focus:border-brand-primary" placeholder="Nhập mức lương">
                    </div>
                    <div class="flex flex-col">
                        <label class="font-bold text-gray-800 mb-2">Chức vụ <span class="text-red-500">*</span></label>
                        <select id="employeeRole" class="border border-gray-300 rounded-md px-4 py-3 focus:outline-none focus:border-brand-primary bg-white appearance-none">
                            <option value="" disabled selected>Chọn chức vụ</option>
                            <option value="Pha chế">Pha chế</option>
                            <option value="Phục vụ">Phục vụ</option>
                            <option value="Giữ xe">Giữ xe</option>
                        </select>
                    </div>
                </div>

                <div class="flex justify-end gap-6 border-t border-gray-100 pt-8 mt-2">
                    <button type="button" id="cancelAddBtn" class="bg-white text-gray-700 uppercase px-8 py-3 rounded-full font-bold text-[18px] hover:bg-gray-100 transition tracking-wide border-2 border-gray-500">
                        HỦY THAO TÁC
                    </button>
                    <button type="submit" class="bg-[#78594A] text-white uppercase px-10 py-3 rounded-full font-bold text-[18px] shadow-sm hover:bg-[#5c4133] transition tracking-wide border-2 border-[#78594A]">
                        LƯU THÔNG TIN
                    </button>
                </div>
            </form>
        </div>
    </main>

    <div id="errorModal" class="fixed inset-0 bg-black/40 z-[100] hidden opacity-0 transition-opacity duration-300 flex items-center justify-center">
        <div class="bg-white rounded-[20px] shadow-2xl p-8 max-w-[420px] w-[90%] flex flex-col items-center transform scale-95 opacity-0 transition-all duration-300" id="errorModalContent">
            <div class="w-16 h-16 bg-[#F05243] rounded-full flex items-center justify-center mb-4">
                <i class="fa-solid fa-xmark text-white text-[32px]"></i>
            </div>
            <h3 class="text-[#8B6E60] font-bold text-[22px] uppercase mb-2 tracking-wide">THÔNG BÁO</h3>
            <p id="errorMessage" class="text-gray-500 text-[18px] text-center mb-8"></p>
            <button id="closeErrorBtn" class="bg-[#6B4B3E] text-white font-bold px-8 py-2 rounded-md hover:bg-[#5c4133] transition text-[18px] min-w-[120px]">
                Đóng
            </button>
        </div>
    </div>

    <script src="../../assets/js/contract_add.js"></script>
</body>

</html>
