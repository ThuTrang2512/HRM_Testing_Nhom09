<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đi Lạc Coffee - Thêm Nhân viên</title>

    <!-- Global CSS -->
    <link rel="stylesheet" href="../../assets/css/style.css">

    <!-- Icons -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Montserrat', 'sans-serif'],
                        heading: ['Nunito', 'sans-serif'],
                    },
                    colors: {
                        brand: {
                            text: '#5c4133',
                            dark: 'rgba(75, 46, 31, 0.87)', 
                            primary: '#78594A', 
                            light: '#f4ede7', 
                            active: '#d6b5a3', 
                            border: '#d2c5bc' 
                        }
                    }
                }
            }
        }
    </script>
    <style>
        .nav-item {
            position: relative;
            white-space: nowrap;
        }

        .nav-item.active {
            font-weight: 700;
            color: #d6b5a3;
        }

        .nav-item.active::after {
            content: '';
            position: absolute;
            bottom: 0px;
            left: 0;
            right: 0;
            height: 4px;
            background-color: #d6b5a3;
            border-radius: 2px 2px 0 0;
        }

        /* Dropdown nav */
        .nav-dropdown {
            position: relative;
        }
        .nav-dropdown-menu {
            display: none;
            position: absolute;
            top: 100%;
            right: 0;
            background: white;
            border: 1px solid #e5e7eb;
            border-radius: 8px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.12);
            min-width: 200px;
            z-index: 999;
            overflow: hidden;
        }
        .nav-dropdown.open .nav-dropdown-menu {
            display: block;
        }
        .nav-dropdown-menu a {
            display: block;
            padding: 12px 20px;
            font-size: 15px;
            font-weight: 600;
            color: #4B2E1F;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            white-space: nowrap;
            text-decoration: none;
            transition: background 0.15s;
        }
        .nav-dropdown-menu a:hover {
            background: #f5ede8;
        }
        .nav-dropdown-menu a + a {
            border-top: 1px solid #f3f4f6;
        }
    </style>
</head>

<body class="bg-[#f0f2f5] min-h-screen text-[23px] text-gray-800 flex flex-col font-sans">

    <!-- Header Section -->
    <header class="bg-white px-8 py-3 flex justify-between items-center sm:flex-row flex-col gap-4 border-b border-gray-100">
        <div class="flex items-center gap-4">
            <div class="w-16 h-16 rounded-full overflow-hidden flex-shrink-0 flex items-center justify-center bg-[#2d221c]">
                <img src="../../assets/images/logo.png" alt="Logo Đi Lạc" class="w-full h-full object-cover">
            </div>
            <h1 class="font-bold text-[26px] uppercase tracking-wider text-brand-text m-0">ĐI LẠC COFFEE</h1>
        </div>
        <div class="flex items-center gap-4">
            <span class="text-gray-800 text-[23px]"><span class="italic font-medium">Xin chào, </span><span class="italic font-bold">Đi Lạc coffee</span></span>
            <div class="w-12 h-12 rounded-full flex items-center justify-center text-gray-700 cursor-pointer transition">
                <i class="fa-regular fa-circle-user text-[40px]"></i>
            </div>
        </div>
    </header>

    <!-- Navigation -->
    <nav class="bg-[#4B2E1F]/[0.87] px-8 py-0 flex flex-wrap justify-center gap-x-12 gap-y-2 text-white text-[23px] font-semibold">
        <a href="/pages/dashboard.html" class="nav-item py-[16px] transition-colors hover:text-[#d6b5a3]">Tổng quan</a>
        <a href="/pages/employee/employee_list.html" class="nav-item active py-[16px] transition-colors hover:text-[#d6b5a3]">Nhân viên</a>
        <a href="/pages/contract/contract_list.html" class="nav-item py-[16px] transition-colors hover:text-[#d6b5a3]">Hợp đồng</a>
        <!-- Lịch làm việc Dropdown -->
        <div class="relative group cursor-pointer">
            <div class="nav-item py-[16px] transition-colors hover:text-[#d6b5a3] flex items-center gap-2">
                Lịch làm việc
                <i class="fa-solid fa-chevron-down text-[16px] opacity-70"></i>
            </div>
            <!-- Dropdown menu -->
            <div class="absolute left-1/2 -translate-x-1/2 mt-0 w-64 bg-white rounded-lg shadow-xl opacity-0 invisible group-hover:opacity-100 group-hover:visible transition-all duration-300 z-50 overflow-hidden text-[16px] text-gray-800 border border-gray-100">
                <a href="/pages/schedule/schedule_list.html" class="block px-5 py-3.5 hover:bg-[#f9f5f3] hover:text-brand-text transition-colors font-medium border-b border-gray-50">Tạo lịch làm việc</a>
                <a href="/pages/schedule/schedule_notification.html" class="block px-5 py-3.5 hover:bg-[#f9f5f3] hover:text-brand-text transition-colors font-medium">Gửi thông báo lịch làm việc</a>
            </div>
        </div>
        <a href="/pages/request/request.html" class="nav-item py-[16px] transition-colors hover:text-[#d6b5a3]">Yêu cầu</a>
        <a href="/pages/salary/salary.html" class="nav-item py-[16px] transition-colors hover:text-[#d6b5a3]">Bảng lương</a>
        <!-- Báo cáo dropdown -->
        <div class="nav-dropdown nav-item py-[16px]" id="baoCaoDropdown">
            <span class="cursor-pointer hover:text-[#d6b5a3] transition-colors select-none" onclick="toggleDropdown()">Báo cáo</span>
            <div class="nav-dropdown-menu" id="baoCaoMenu">
                <a href="/report/salary/">Báo cáo lương</a>
                <a href="/report/attendance/">Báo cáo chấm công</a>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="flex-grow p-8 max-w-[1400px] w-full mx-auto">
        <!-- White Card Container -->
        <div class="bg-white rounded-2xl shadow-lg w-full p-8">
            <!-- Page Title -->
            <div class="mb-6">
                <a href="employee_list.html" class="flex items-center uppercase font-bold text-[24px] text-brand-text hover:text-brand-primary transition mb-2">
                    <i class="fa-solid fa-arrow-left text-[20px] mr-3"></i>
                    VUI LÒNG NHẬP THÔNG TIN NHÂN VIÊN
                </a>
            </div>

            <!-- Layout Grid -->
            <form id="employeeAddForm" class="w-full flex md:flex-row flex-col gap-8 items-start">
                <!-- Avatar Left Side -->
                <div class="w-[280px] flex-shrink-0">
                    <div id="avatarContainer" class="w-[280px] h-[380px] border-2 border-gray-200 flex items-center justify-center bg-[#F9F9F9] rounded-lg relative overflow-hidden cursor-pointer hover:bg-gray-100 transition group shadow-sm">
                        <img id="avatarImage" src="" alt="Ảnh nhân viên" class="w-full h-full object-cover hidden">
                        <div id="avatarPlaceholder" class="absolute inset-0 flex items-center justify-center bg-gray-100">
                            <i class="fa-solid fa-user text-gray-300 text-[140px]"></i>
                        </div>
                        <div class="absolute inset-0 bg-black/0 group-hover:bg-black/20 flex items-center justify-center opacity-0 group-hover:opacity-100 transition">
                            <i class="fa-solid fa-camera text-white text-[50px]"></i>
                        </div>
                    </div>
                    <input type="file" id="imageInput" accept="image/*" class="hidden">
                    <p class="text-center text-gray-500 text-[13px] mt-3">Nhấp để tải ảnh</p>
                </div>

                <!-- Form Content Right Side - 2 Columns in Box -->
                <div class="flex-grow">
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-x-10 gap-y-6 text-[18px]">
                        
                        <!-- Họ và tên -->
                        <div class="flex flex-col gap-2">
                            <label class="font-bold text-brand-text text-[20px]">Họ và tên <span class="text-red-500">*</span></label>
                            <input type="text" id="empName" class="border border-gray-300 rounded-md px-4 py-2 focus:outline-none focus:border-brand-primary placeholder:text-gray-400" placeholder="Nhập họ tên">
                        </div>
                        
                        <!-- Chức vụ -->
                        <div class="flex flex-col gap-2">
                            <label class="font-bold text-brand-text text-[20px]">Chức vụ <span class="text-red-500">*</span></label>
                            <select id="empRole" class="border border-gray-300 rounded-md px-4 py-2 focus:outline-none focus:border-brand-primary bg-white appearance-none">
                                <option value="" disabled selected hidden>Chọn chức vụ</option>
                                <option value="Pha chế">Pha chế</option>
                                <option value="Phục vụ">Phục vụ</option>
                                <option value="Giữ xe">Giữ xe</option>
                                <option value="Quản lý">Quản lý</option>
                            </select>
                        </div>

                        <!-- Giới tính -->
                        <div class="flex flex-col gap-2">
                            <label class="font-bold text-brand-text text-[20px]">Giới tính <span class="text-red-500">*</span></label>
                            <select id="empGender" class="border border-gray-300 rounded-md px-4 py-2 focus:outline-none focus:border-brand-primary bg-white appearance-none">
                                <option value="" disabled selected hidden>Chọn giới tính</option>
                                <option value="Nam">Nam</option>
                                <option value="Nữ">Nữ</option>
                            </select>
                        </div>

                        <!-- Ngày sinh -->
                        <div class="flex flex-col gap-2">
                            <label class="font-bold text-brand-text text-[20px]">Ngày sinh <span class="text-red-500">*</span></label>
                            <input type="date" id="empDob" class="border border-gray-300 rounded-md px-4 py-2 focus:outline-none focus:border-brand-primary text-gray-700">
                        </div>

                        <!-- Số CCCD -->
                        <div class="flex flex-col gap-2">
                            <label class="font-bold text-brand-text text-[20px]">Số CCCD <span class="text-red-500">*</span></label>
                            <input type="text" id="empCccd" class="border border-gray-300 rounded-md px-4 py-2 focus:outline-none focus:border-brand-primary placeholder:text-gray-400" placeholder="Nhập CCCD">
                        </div>

                        <!-- Số điện thoại -->
                        <div class="flex flex-col gap-2">
                            <label class="font-bold text-brand-text text-[20px]">Số điện thoại <span class="text-red-500">*</span></label>
                            <input type="text" id="empPhone" class="border border-gray-300 rounded-md px-4 py-2 focus:outline-none focus:border-brand-primary placeholder:text-gray-400" placeholder="Nhập số điện thoại">
                        </div>

                        <!-- Địa chỉ thường trú (Full width) -->
                        <div class="flex flex-col gap-2 md:col-span-2">
                            <label class="font-bold text-brand-text text-[20px]">Địa chỉ thường trú <span class="text-red-500">*</span></label>
                            <textarea id="empAddress" rows="2" class="border border-gray-300 rounded-md px-4 py-2 focus:outline-none focus:border-brand-primary placeholder:text-gray-400 resize-none" placeholder="Nhập địa chỉ"></textarea>
                        </div>

                        <!-- Địa chỉ làm việc (Full width) -->
                        <div class="flex flex-col gap-2 md:col-span-2">
                            <label class="font-bold text-brand-text text-[20px]">Địa chỉ làm việc <span class="text-red-500">*</span></label>
                            <textarea id="empWorkAddress" rows="2" class="border border-gray-300 rounded-md px-4 py-2 focus:outline-none focus:border-brand-primary placeholder:text-gray-400 resize-none" placeholder="Nhập địa chỉ"></textarea>
                        </div>
                    </div>

                    <!-- Submit Button -->
                    <div class="flex justify-end gap-6 mt-8">
                        <button type="button" id="btnCancel" onclick="window.location.href='employee_list.html'" class="bg-[#D9D9D9] text-gray-700 font-bold px-12 py-[10px] rounded-md hover:bg-gray-400 transition text-[20px]">
                            HỦY
                        </button>
                        <button type="submit" id="saveBtn" class="bg-[#6B4B3E] text-white font-bold px-10 py-[10px] rounded-md shadow-sm hover:bg-[#5c4133] transition text-[20px]">
                            LƯU
                        </button>
                    </div>

                </div>
            </form>
        </div>
    </main>

    <!-- Error Modal Popup -->
    <div id="errorModal" class="fixed inset-0 bg-black/40 z-[100] flex items-center justify-center hidden opacity-0 transition-opacity duration-300">
        <div id="errorModalContent" class="bg-white rounded-[20px] shadow-2xl p-8 max-w-[420px] w-[90%] flex flex-col items-center transform scale-95 opacity-0 transition-all duration-300">
            <!-- Red Error Icon -->
            <div class="w-16 h-16 bg-[#F05243] rounded-full flex items-center justify-center mb-4">
                <i class="fa-solid fa-xmark text-white text-[32px]"></i>
            </div>
            
            <!-- Title -->
            <h3 class="text-[#8B6E60] font-bold text-[22px] uppercase mb-2 tracking-wide">THÔNG BÁO LỖI</h3>
            
            <!-- Message -->
            <p id="errorText" class="text-gray-500 text-[18px] text-center mb-8 w-full">Xin vui lòng nhập đầy đủ thông tin !</p>
            
            <!-- Buttons -->
            <div class="flex gap-4 w-full justify-center">
                <button type="button" id="btnThoat" class="bg-[#E5E5E5] text-gray-700 font-bold px-8 py-2 rounded-md hover:bg-gray-300 transition text-[18px] min-w-[120px]">
                    Thoát
                </button>
                <button type="button" id="btnQuayLai" class="bg-[#6B4B3E] text-white font-bold px-8 py-2 rounded-md hover:bg-[#5c4133] transition text-[18px] min-w-[120px]">
                    Quay lại
                </button>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script>
        function toggleDropdown() {
            const dd = document.getElementById('baoCaoDropdown');
            dd.classList.toggle('open');
        }
        // Close dropdown when clicking outside
        document.addEventListener('click', function(e) {
            const dd = document.getElementById('baoCaoDropdown');
            if (dd && !dd.contains(e.target)) {
                dd.classList.remove('open');
            }
        });
    </script>
    <script src="../../assets/js/employee_add.js"></script>
</body>
</html>
