<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đi Lạc Coffee - Chi tiết nhân viên</title>

    <!-- Global CSS -->
    <link rel="stylesheet" href="../../assets/css/style.css">

    <!-- Icons -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Montserrat', 'sans-serif'],
                        heading: ['Nunito', 'sans-serif'],
                    },
                    colors: {
                        brand: {
                            text: '#5c4133',
                            dark: 'rgba(75, 46, 31, 0.87)', 
                            primary: '#78594A', 
                            light: '#f4ede7', 
                            active: '#d6b5a3', 
                            border: '#d2c5bc' 
                        }
                    }
                }
            }
        }
    </script>
    <style>
        .nav-item {
            position: relative;
            white-space: nowrap;
        }

        .nav-item.active {
            font-weight: 700;
            color: #d6b5a3;
        }

        .nav-item.active::after {
            content: '';
            position: absolute;
            bottom: 0px;
            left: 0;
            right: 0;
            height: 4px;
            background-color: #d6b5a3;
            border-radius: 2px 2px 0 0;
        }
    </style>
</head>

<body class="bg-white min-h-screen text-[16px] xl:text-[23px] text-gray-800 flex flex-col font-sans">

    <!-- Header Section -->
    <header class="bg-white px-8 py-3 flex justify-between items-center sm:flex-row flex-col gap-4 border-b border-gray-100 shadow-sm z-10 relative">
        <div class="flex items-center gap-4">
            <div class="w-16 h-16 rounded-full overflow-hidden flex-shrink-0 flex items-center justify-center bg-[#2d221c]">
                <img src="../../assets/images/logo.png" alt="Logo Đi Lạc" class="w-full h-full object-cover">
            </div>
            <h1 class="font-bold text-[26px] uppercase tracking-wider text-brand-text m-0">ĐI LẠC COFFEE</h1>
        </div>
        <div class="flex items-center gap-4">
            <span class="text-gray-800 text-[23px]"><span class="italic font-medium">Xin chào, </span><span class="italic font-bold">Đi Lạc coffee</span></span>
            <div class="w-12 h-12 rounded-full flex items-center justify-center text-gray-700 cursor-pointer transition">
                <i class="fa-regular fa-circle-user text-[40px]"></i>
            </div>
        </div>
    </header>

    <!-- Navigation -->
    <nav class="bg-[#4B2E1F]/[0.87] px-8 py-0 flex flex-wrap justify-center gap-x-12 gap-y-2 text-white text-[23px] font-semibold relative z-10">
        <a href="../dashboard.html" class="nav-item py-[16px] transition-colors hover:text-[#d6b5a3]">Tổng quan</a>
        <a href="employee_list.html" class="nav-item active py-[16px] transition-colors hover:text-[#d6b5a3]">Nhân viên</a>
        <a href="#" class="nav-item py-[16px] transition-colors hover:text-[#d6b5a3]">Hợp đồng</a>
        <a href="#" class="nav-item py-[16px] transition-colors hover:text-[#d6b5a3]">Lịch làm việc</a>
        <a href="#" class="nav-item py-[16px] transition-colors hover:text-[#d6b5a3]">Yêu cầu</a>
        <a href="#" class="nav-item py-[16px] transition-colors hover:text-[#d6b5a3]">Bảng lương</a>
        <a href="#" class="nav-item py-[16px] transition-colors hover:text-[#d6b5a3]">Báo cáo</a>
    </nav>

    <!-- Main Content -->
    <main class="flex-grow p-8 max-w-[1400px] w-full mx-auto relative text-[20px]">
        
        <!-- Search Bar Area (Mockup Replica) -->
        <div class="flex items-center justify-center gap-4 mb-8">
            <div class="relative w-full max-w-[800px]">
                <span class="absolute inset-y-0 left-0 flex items-center pl-4 text-gray-400">
                    <i class="fa-solid fa-magnifying-glass"></i>
                </span>
                <input type="text" placeholder="Nhập tên nhân viên" class="w-full border border-gray-200 rounded-md py-[10px] pl-12 pr-4 text-gray-600 bg-[#FAFAFA] focus:outline-none focus:border-brand-primary placeholder:text-[18px]">
            </div>
            <button class="bg-[#8C6B5D] text-white px-8 py-[10px] rounded-md font-bold hover:bg-[#78594A] transition">
                <i class="fa-solid fa-magnifying-glass mr-2"></i> Tìm kiếm
            </button>
        </div>

        <!-- Back Button & Title -->
        <div class="mb-6 flex flex-col items-start px-2">
            <a href="employee_list.html" class="bg-[#8C6B5D] text-white px-6 py-2 pb-3 mb-6 block text-[20px] shadow-sm hover:bg-[#78594A] transition items-center">
                <i class="fa-solid fa-arrow-left-long"></i> Quay lại danh sách
            </a>
            
            <h2 class="text-brand-text font-bold text-[24px] uppercase border-l-4 border-brand-text pl-3 flex items-center h-8">
                Thông tin chi tiết nhân viên
            </h2>
        </div>

        <!-- Details Box -->
        <div class="w-full flex md:flex-row flex-col gap-10">
            <!-- Avatar Left Side -->
            <div class="w-[300px] flex-shrink-0">
                <div class="w-full aspect-square border-2 border-gray-100 flex items-center justify-center bg-[#F9F9F9] rounded-sm relative overflow-hidden">
                    <i class="fa-solid fa-user text-gray-200 text-[180px] mt-12"></i>
                </div>
            </div>

            <!-- Detail Grid Right Side -->
            <div class="flex-grow grid grid-cols-1 md:grid-cols-3 gap-x-8 gap-y-6 text-[18px]">
                <!-- Column 1 -->
                <div class="flex flex-col gap-2">
                    <label class="font-bold text-black text-[20px]">Mã nhân viên<span class="text-red-500">*</span></label>
                    <input type="text" id="viewId" readonly class="border border-gray-200 rounded-sm px-4 py-2 bg-white text-gray-700 outline-none">
                </div>
                <!-- Column 2 -->
                <div class="flex flex-col gap-2">
                    <label class="font-bold text-black text-[20px]">Họ và tên<span class="text-red-500">*</span></label>
                    <input type="text" id="viewName" readonly class="border border-gray-200 rounded-sm px-4 py-2 bg-white text-gray-700 outline-none">
                </div>
                <!-- Column 3 -->
                <div class="flex flex-col gap-2">
                    <label class="font-bold text-black text-[20px]">Giới tính<span class="text-red-500">*</span></label>
                    <input type="text" id="viewGender" readonly class="border border-gray-200 rounded-sm px-4 py-2 bg-white text-gray-700 outline-none">
                </div>

                <!-- Row 2 -->
                <div class="flex flex-col gap-2">
                    <label class="font-bold text-black text-[20px]">CCCD<span class="text-red-500">*</span></label>
                    <input type="text" id="viewCccd" readonly class="border border-gray-200 rounded-sm px-4 py-2 bg-white text-gray-700 outline-none">
                </div>
                <div class="flex flex-col gap-2">
                    <label class="font-bold text-black text-[20px]">Số điện thoại<span class="text-red-500">*</span></label>
                    <input type="text" id="viewPhone" readonly class="border border-gray-200 rounded-sm px-4 py-2 bg-white text-gray-700 outline-none">
                </div>
                <div class="flex flex-col gap-2">
                    <label class="font-bold text-black text-[20px]">Năm sinh<span class="text-red-500">*</span></label>
                    <input type="text" id="viewDob" readonly class="border border-gray-200 rounded-sm px-4 py-2 bg-white text-gray-700 outline-none">
                </div>

                <!-- Row 3 -->
                <div class="flex flex-col gap-2">
                    <label class="font-bold text-black text-[20px]">Địa chỉ thường trú<span class="text-red-500">*</span></label>
                    <textarea id="viewAddress" readonly rows="4" class="border border-gray-200 rounded-sm px-4 py-2 bg-white text-gray-500 italic outline-none resize-none"></textarea>
                </div>
                <div class="flex flex-col gap-2">
                    <label class="font-bold text-black text-[20px]">Địa chỉ tạm trú<span class="text-red-500">*</span></label>
                    <textarea id="viewTempAddress" readonly rows="4" class="border border-gray-200 rounded-sm px-4 py-2 bg-white text-gray-500 italic outline-none resize-none"></textarea>
                </div>
                <div class="flex flex-col gap-2">
                    <label class="font-bold text-black text-[20px]">Chức vụ<span class="text-red-500">*</span></label>
                    <input type="text" id="viewRole" readonly class="border border-gray-200 rounded-sm px-4 py-2 bg-white text-gray-700 outline-none">
                </div>
            </div>
        </div>

        <!-- Action Buttons -->
        <div class="flex justify-end gap-10 mt-8 mb-6 mr-4">
            <button type="button" class="bg-[#D9D9D9] text-gray-700 font-bold px-12 py-[10px] rounded-md hover:bg-gray-400 transition text-[20px]">
                Xóa
            </button>
            <button type="button" id="btnGoToEdit" class="bg-[#6B4B3E] text-white font-bold px-12 py-[10px] rounded-md hover:bg-[#5c4133] shadow-sm transition text-[20px]">
                Chỉnh sửa
            </button>
        </div>
    </main>

    <!-- Scripts -->
    <script src="../../assets/js/employee_detail.js"></script>
</body>
</html>
