<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đi Lạc Coffee - Chi tiết nhân viên</title>

    <!-- Global CSS -->
    <link rel="stylesheet" href="../../assets/css/style.css">

    <!-- Icons -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Montserrat', 'sans-serif'],
                        heading: ['Nunito', 'sans-serif'],
                    },
                    colors: {
                        brand: {
                            text: '#5c4133',
                            dark: 'rgba(75, 46, 31, 0.87)',
                            primary: '#78594A',
                            light: '#f4ede7',
                            active: '#d6b5a3',
                            border: '#d2c5bc'
                        }
                    }
                }
            }
        }
    </script>
    <style>
        .nav-item {
            position: relative;
            white-space: nowrap;
        }

        .nav-item.active {
            font-weight: 700;
            color: #d6b5a3;
        }

        .nav-item.active::after {
            content: '';
            position: absolute;
            bottom: 0px;
            left: 0;
            right: 0;
            height: 4px;
            background-color: #d6b5a3;
            border-radius: 2px 2px 0 0;
        }
    </style>
</head>

<body class="bg-[#f0f2f5] min-h-screen text-[16px] xl:text-[23px] text-gray-800 flex flex-col font-sans">

    <!-- Header Section -->
    <header
        class="bg-white px-8 py-3 flex justify-between items-center sm:flex-row flex-col gap-4 border-b border-gray-100 shadow-sm z-10 relative">
        <div class="flex items-center gap-4">
            <div
                class="w-16 h-16 rounded-full overflow-hidden flex-shrink-0 flex items-center justify-center bg-[#2d221c]">
                <img src="../../assets/images/logo.png" alt="Logo Đi Lạc" class="w-full h-full object-cover">
            </div>
            <h1 class="font-bold text-[26px] uppercase tracking-wider text-brand-text m-0">ĐI LẠC COFFEE</h1>
        </div>
        <div class="flex items-center gap-4">
            <span class="text-gray-800 text-[23px]"><span class="italic font-medium">Xin chào, </span><span
                    class="italic font-bold">Đi Lạc coffee</span></span>
            <div
                class="w-12 h-12 rounded-full flex items-center justify-center text-gray-700 cursor-pointer transition">
                <i class="fa-regular fa-circle-user text-[40px]"></i>
            </div>
        </div>
    </header>

    <!-- Navigation -->
    <nav
        class="bg-[#4B2E1F]/[0.87] px-8 py-0 flex flex-wrap justify-center gap-x-12 gap-y-2 text-white text-[23px] font-semibold relative z-10">
        <a href="../dashboard.html" class="nav-item py-[16px] transition-colors hover:text-[#d6b5a3]">Tổng quan</a>
        <a href="employee_list.html" class="nav-item active py-[16px] transition-colors hover:text-[#d6b5a3]">Nhân
            viên</a>
        <a href="#" class="nav-item py-[16px] transition-colors hover:text-[#d6b5a3]">Hợp đồng</a>
        <a href="#" class="nav-item py-[16px] transition-colors hover:text-[#d6b5a3]">Lịch làm việc</a>
        <a href="#" class="nav-item py-[16px] transition-colors hover:text-[#d6b5a3]">Yêu cầu</a>
        <a href="#" class="nav-item py-[16px] transition-colors hover:text-[#d6b5a3]">Bảng lương</a>
        <a href="#" class="nav-item py-[16px] transition-colors hover:text-[#d6b5a3]">Báo cáo</a>
    </nav>

    <!-- Main Content -->
    <main class="flex-grow p-8 max-w-[1400px] w-full mx-auto">
        <!-- White Card Container -->
        <div class="bg-white rounded-2xl shadow-lg w-full p-8">
            <!-- Page Title -->
            <div class="mb-6">
                <a href="employee_list.html"
                    class="flex items-center uppercase font-bold text-[24px] text-brand-text hover:text-brand-primary transition mb-2">
                    <i class="fa-solid fa-arrow-left text-[20px] mr-3"></i>
                    THÔNG TIN CHI TIẾT NHÂN VIÊN
                </a>
            </div>
            <!-- Layout Grid -->
            <div class="w-full flex md:flex-row flex-col gap-8 items-start">
                <!-- Avatar Left Side -->
                <div class="w-[280px] flex-shrink-0">
                    <div id="avatarContainer"
                        class="w-[280px] h-[380px] border-2 border-gray-200 flex items-center justify-center bg-[#F9F9F9] rounded-lg relative overflow-hidden shadow-sm">
                        <img id="avatarImage" src="" alt="Ảnh nhân viên" class="w-full h-full object-cover hidden">
                        <div id="avatarPlaceholder"
                            class="absolute inset-0 flex items-center justify-center bg-gray-100">
                            <i class="fa-solid fa-user text-gray-300 text-[140px]"></i>
                        </div>
                    </div>
                </div>
                <!-- Form Content Right Side - 2 Columns in Box -->
                <div class="flex-grow">
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-x-10 gap-y-6 text-[18px]">
                        <!-- Row 1: Mã nhân viên -->
                        <div class="flex flex-col gap-2">
                            <label class="font-bold text-brand-text text-[20px]">Mã nhân viên<span
                                    class="text-red-500">*</span></label>
                            <input type="text" id="viewId" readonly
                                class="border border-gray-300 rounded-md px-4 py-2 bg-gray-50 text-gray-700 outline-none">
                        </div>
                        <!-- Right Column: Họ tên -->
                        <div class="flex flex-col gap-2">
                            <label class="font-bold text-brand-text text-[20px]">Họ tên<span
                                    class="text-red-500">*</span></label>
                            <input type="text" id="viewName" readonly
                                class="border border-gray-300 rounded-md px-4 py-2 bg-gray-50 text-gray-700 outline-none">
                        </div>
                        <!-- Row 2: Giới tính -->
                        <div class="flex flex-col gap-2">
                            <label class="font-bold text-brand-text text-[20px]">Giới tính<span
                                    class="text-red-500">*</span></label>
                            <input type="text" id="viewGender" readonly
                                class="border border-gray-300 rounded-md px-4 py-2 bg-gray-50 text-gray-700 outline-none">
                        </div>
                        <!-- Right: Ngày sinh -->
                        <div class="flex flex-col gap-2">
                            <label class="font-bold text-brand-text text-[20px]">Ngày sinh<span
                                    class="text-red-500">*</span></label>
                            <input type="text" id="viewDob" readonly
                                class="border border-gray-300 rounded-md px-4 py-2 bg-gray-50 text-gray-700 outline-none">
                        </div>
                        <!-- Row 3: CCCD -->
                        <div class="flex flex-col gap-2">
                            <label class="font-bold text-brand-text text-[20px]">CCCD<span
                                    class="text-red-500">*</span></label>
                            <input type="text" id="viewCccd" readonly
                                class="border border-gray-300 rounded-md px-4 py-2 bg-gray-50 text-gray-700 outline-none">
                        </div>
                        <!-- Right: Số điện thoại -->
                        <div class="flex flex-col gap-2">
                            <label class="font-bold text-brand-text text-[20px]">Số điện thoại<span
                                    class="text-red-500">*</span></label>
                            <input type="text" id="viewPhone" readonly
                                class="border border-gray-300 rounded-md px-4 py-2 bg-gray-50 text-gray-700 outline-none">
                        </div>
                        <!-- Row 4: Tài khoản ngân hàng -->
                        <div class="flex flex-col gap-2">
                            <label class="font-bold text-brand-text text-[20px]">Tài khoản ngân hàng<span
                                    class="text-red-500">*</span></label>
                            <input type="text" id="viewBankAccount" readonly
                                class="border border-gray-300 rounded-md px-4 py-2 bg-gray-50 text-gray-700 outline-none">
                        </div>
                        <!-- Right: Chức vụ -->
                        <div class="flex flex-col gap-2">
                            <label class="font-bold text-brand-text text-[20px]">Chức vụ<span
                                    class="text-red-500">*</span></label>
                            <input type="text" id="viewRole" readonly
                                class="border border-gray-300 rounded-md px-4 py-2 bg-gray-50 text-gray-700 outline-none">
                        </div>
                        <!-- Row 5: Địa chỉ (Full width) -->
                        <div class="flex flex-col gap-2 md:col-span-2">
                            <label class="font-bold text-brand-text text-[20px]">Địa chỉ<span
                                    class="text-red-500">*</span></label>
                            <textarea id="viewAddress" readonly rows="3"
                                class="border border-gray-300 rounded-md px-4 py-2 bg-gray-50 text-gray-700 outline-none resize-none"></textarea>
                        </div>
                        <!-- Row 6: Địa chỉ làm việc (Full width) -->
                        <div class="flex flex-col gap-2 md:col-span-2">
                            <label class="font-bold text-brand-text text-[20px]">Địa chỉ làm việc<span
                                    class="text-red-500">*</span></label>
                            <textarea id="viewWorkAddress" readonly rows="3"
                                class="border border-gray-300 rounded-md px-4 py-2 bg-gray-50 text-gray-700 outline-none resize-none"></textarea>
                        </div>
                    </div>
                    <!-- Action Buttons -->
                    <div class="flex justify-end gap-6 mt-8 md:col-span-2">
                        <button type="button" id="btnCancel"
                            class="bg-[#D9D9D9] text-gray-700 font-bold px-12 py-[10px] rounded-md hover:bg-gray-400 transition text-[20px]">
                            HỦY
                        </button>
                        <button type="button" id="btnGoToEdit"
                            class="bg-[#6B4B3E] text-white font-bold px-8 py-[10px] rounded-md hover:bg-[#5c4133] shadow-sm transition text-[20px]">
                            CHỈNH SỬA
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- Scripts -->
    <script src="../../assets/js/employee_detail.js"></script>
</body>

</html>
